# semantic-release, run by .github/workflows/release.yml on every push to
# main, from the git root, with the tool installed in .github/release.

branches:
  - main

# The history follows Conventional Commits. The default preset (angular) does
# not recognise `feat!:` as a breaking change.
preset: conventionalcommits

# The sections of the release notes and the changelog. The preset's own list,
# except that "Code Refactoring" is shown: a refactor makes a release here
# (see the commit analyzer below), and a release of refactors alone would
# otherwise have empty notes. A list given here replaces the preset's whole
# list, so every type is named.
presetConfig:
  types:
    - { type: feat, section: Features }
    - { type: feature, section: Features }
    - { type: fix, section: Bug Fixes }
    - { type: perf, section: Performance Improvements }
    - { type: refactor, section: Code Refactoring }
    - { type: revert, section: Reverts }
    - { type: docs, section: Documentation, hidden: true }
    - { type: style, section: Styles, hidden: true }
    - { type: chore, section: Miscellaneous Chores, hidden: true }
    - { type: test, section: Tests, hidden: true }
    - { type: build, section: Build System, hidden: true }
    - { type: ci, section: Continuous Integration, hidden: true }

plugins:
  # A refactor is a patch. The app is deployed, not used as a library, and the
  # version identifies the build its footer shows: a change to the code that
  # ships gets a version of its own, as a `perf` does by default. Docs, tests,
  # chores, CI, build and style changes still make no release. The preset's
  # own rules apply to every commit this one does not match.
  - - "@semantic-release/commit-analyzer"
    - releaseRules:
        - { type: refactor, release: patch }
  - "@semantic-release/release-notes-generator"

  # Order matters from here on: the changelog and the version have to be
  # written before the git plugin commits them.
  # No `changelogFile`: the default is CHANGELOG.md at the git root, beside
  # the package it describes.
  - - "@semantic-release/changelog"
    - changelogTitle: "# Changelog"

  # Only bumps the version in package.json and package-lock.json. The app is
  # private and never published to npm. No `pkgRoot`: the default is the git
  # root, where the package is.
  - - "@semantic-release/npm"
    - npmPublish: false

  # No `assets`: the plugin's default commits CHANGELOG.md, package.json and
  # package-lock.json at the git root, which are the three files the steps
  # above write.
  - - "@semantic-release/git"
    # Without the `[skip ci]` of the plugin's default message: Netlify has to
    # build this commit, because the app shows the version from package.json.
    # GitHub runs no workflow for it either way, since a push made with the
    # workflow's own token triggers none.
    - message: "chore(release): ${nextRelease.version}\n\n${nextRelease.notes}"

  # Creates the GitHub release. Comments and labels on issues and pull
  # requests are off, and so is the issue it would open for a failed release,
  # so the workflow needs no permission beyond `contents: write`.
  - - "@semantic-release/github"
    - successComment: false
      failComment: false
      failTitle: false
      releasedLabels: false
