name: CI

# A merged pull request arrives as a push, so this covers merges too.
on:
  push:
    branches: [main, develop]

# One run at a time for the whole repo, not per branch: every run uses the
# same Supabase Cloud project and its sign-in rate limit, so runs queue
# instead of overlapping.
concurrency:
  group: supabase-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A release pushes the commit that was just tested on develop to main as
  # well, and the concurrency group above runs the two one after the other.
  # On main, a commit that already passed on develop is not tested again: it
  # is the same code. Any other push to main runs every check.
  already-tested:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      # Reads this workflow's earlier runs; no secrets in this job.
      actions: read
    outputs:
      passed-on-develop: ${{ steps.lookup.outputs.passed }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=develop&head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          echo "Successful CI runs of $GITHUB_SHA on develop: $count"
          if [ "$count" -gt 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: already-tested
    if: needs.already-tested.outputs.passed-on-develop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Test tooling only (disposable users via the Admin API); never part of a build.
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Keeps the `prepare` script from installing git hooks on the runner.
      HUSKY: 0
    steps:
      # Actions are pinned to commit SHAs because this job holds the secret key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          # Written out, because .github/release holds a second lock file.
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run lint:md

      - run: npm run format:check

      - run: npm run typecheck

      - name: Unit and RLS tests
        run: npm test

      # Playwright uses the runner's own Chrome (`channel: 'chrome'`), so fail
      # here with a clear message if the runner image stops shipping it.
      - name: Check that Google Chrome is installed
        run: google-chrome --version

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
