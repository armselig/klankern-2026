name: CI

# A merged pull request arrives as a push, so this covers merges too.
on:
  push:
    branches: [main, develop]

# One run at a time for the whole repo, not per branch: every run uses the
# same Supabase Cloud project and its sign-in rate limit, so runs queue
# instead of overlapping.
concurrency:
  group: supabase-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Test tooling only (disposable users via the Admin API); never part of a build.
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Keeps the `prepare` script from installing git hooks on the runner.
      HUSKY: 0
    steps:
      # Actions are pinned to commit SHAs because this job holds the secret key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          # Written out, because .github/release holds a second lock file.
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run lint:md

      - run: npm run format:check

      - run: npm run typecheck

      - name: Unit and RLS tests
        run: npm test

      # Playwright uses the runner's own Chrome (`channel: 'chrome'`), so fail
      # here with a clear message if the runner image stops shipping it.
      - name: Check that Google Chrome is installed
        run: google-chrome --version

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
